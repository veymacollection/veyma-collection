<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Veyma Collection | ویما</title>
  <meta name="description" content="Veyma Collection | ویما — حس راحتی و زیبایی" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.32);
      --gold-glow: rgba(212, 175, 55, 0.22);
      --bg: #050505;
      --card: #111111;
      --border: rgba(255,255,255,0.07);
      --white: #ffffff;
      --muted: #a8a8a8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Vazirmatn', Tahoma, system-ui, sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 16px 14px 28px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
    }

    /* لوگو با هاله و حلقه طلایی */
    .logo-box {
      position: relative;
      width: 108px;
      height: 108px;
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .logo-halo {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-soft) 0%, transparent 68%);
      filter: blur(10px);
      animation: pulse 4.5s ease-in-out infinite;
    }

    .logo-ring {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 1.6px solid transparent;
      background:
        linear-gradient(var(--bg), var(--bg)) padding-box,
        conic-gradient(from 0deg,
          transparent 0%,
          var(--gold) 18%,
          transparent 38%,
          var(--gold) 58%,
          transparent 78%,
          var(--gold) 100%) border-box;
      animation: spin 12s linear infinite;
    }

    .logo {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 2;
      border: 2px solid rgba(212,175,55,0.35);
      box-shadow: 0 0 22px var(--gold-glow);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    .tagline {
      text-align: center;
      font-size: 15.5px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: 0.2px;
      margin-bottom: 2px;
    }
    .tagline span { color: var(--gold); }

    .socials {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .social {
      --glow: 212,175,55;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 10px 13px;
      text-decoration: none;
      color: var(--white);
      font-size: 14px;
      font-weight: 600;
      transition: 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .social:hover {
      border-color: rgba(212,175,55,0.35);
      transform: translateY(-1px);
      box-shadow: 0 5px 18px rgba(0,0,0,0.35);
    }
    .social .ico {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      transition: 0.25s ease;
    }
    .social .ico svg,
    .social .ico img {
      width: 46px;
      height: 46px;
      object-fit: contain;
    }
    .social.ig { --glow: 225,48,108; }
    .social.tg { --glow: 55,174,226; }
    .social.rb { --glow: 170,60,220; }
    .social.bl { --glow: 0,200,170; }
    .social .ico { filter: drop-shadow(0 0 8px rgba(var(--glow),0.35)); }
    .social.bl .ico { width: 70px; height: 70px; margin: -12px 0; }
    .social.bl .ico img { width: 70px; height: 70px; }

    /* حالت روشن بعد از کلیک / لمس */
    .social:active,
    .social.lit,
    .social:focus-visible {
      outline: none;
      border-color: rgba(var(--glow),0.9);
      background: rgba(var(--glow),0.12);
      box-shadow: 0 0 0 1px rgba(var(--glow),0.5), 0 0 24px rgba(var(--glow),0.55);
      transform: translateY(-1px) scale(1.03);
    }
    .social:active .ico,
    .social.lit .ico,
    .social:focus-visible .ico {
      filter: drop-shadow(0 0 14px rgba(var(--glow),0.95));
      transform: scale(1.1);
    }

    .contacts {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .person {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .person-name {
      text-align: center;
      font-weight: 800;
      font-size: 18px;
      color: var(--white);
      margin-bottom: 12px;
    }

    .person-actions {
      display: flex;
      gap: 8px;
    }

    .person-actions a {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 48px;
      border-radius: 12px;
      background: #1f1f1f;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.07);
      color: var(--white);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: 0.2s;
    }
    .person-actions a.call {
      background: linear-gradient(135deg, rgba(212,175,55,0.22), rgba(212,175,55,0.07));
      border-color: rgba(212,175,55,0.5);
    }
    .person-actions a.wa {
      background: linear-gradient(135deg, rgba(37,211,102,0.22), rgba(37,211,102,0.07));
      border-color: rgba(37,211,102,0.5);
    }
    .person-actions a:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }
    .person-actions a.call:hover { box-shadow: 0 6px 18px rgba(212,175,55,0.25); }
    .person-actions a.wa:hover { box-shadow: 0 6px 18px rgba(37,211,102,0.25); }
    .person-actions a:active { transform: scale(0.97); }
    .person-actions a svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .person-actions a.wa svg { fill: #25D366; }
    .person-actions a.call svg { fill: var(--gold); }

    .address {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      gap: 11px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.75;
      color: var(--muted);
    }
    .address svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-top: 3px;
      fill: var(--gold);
    }
    .address strong {
      display: block;
      color: var(--white);
      font-weight: 700;
      font-size: 13.5px;
      margin-bottom: 2px;
    }

    .share-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: linear-gradient(135deg, rgba(212,175,55,0.14), rgba(212,175,55,0.05));
      border: 1px solid rgba(212,175,55,0.38);
      border-radius: 14px;
      padding: 12px 16px;
      color: var(--gold);
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: 0.22s ease;
      margin-top: 2px;
    }
    .share-btn:hover {
      background: linear-gradient(135deg, rgba(212,175,55,0.22), rgba(212,175,55,0.08));
      border-color: rgba(212,175,55,0.55);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(212,175,55,0.12);
    }
    .share-btn svg {
      width: 17px;
      height: 17px;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1c1c1c;
      border: 1px solid rgba(212,175,55,0.4);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: 0.28s ease;
      z-index: 50;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 11.5px;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    @media (max-height: 720px) {
      .wrap { gap: 10px; }
      .logo-box { width: 92px; height: 92px; }
      .logo { width: 92px; height: 92px; }
      .tagline { font-size: 14px; }
      .social { padding: 11px 8px 9px; gap: 6px; }
      .social .ico, .social .ico svg, .social .ico img { width: 40px; height: 40px; }
      .social.bl .ico, .social.bl .ico img { width: 60px; height: 60px; }
      .person { padding: 10px 12px; }
      .contacts { gap: 12px; }
      .person-actions a { min-height: 42px; }
    }

    /* انیمیشن شروع: ریزش جشن از بالا (صفحه از اول کامل دیده می‌شود) */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      background: transparent;
      transition: opacity 0.6s ease;
    }
    #intro.hide { opacity: 0; }
    #intro canvas { width: 100%; height: 100%; display: block; }
    @media (prefers-reduced-motion: reduce) {
      #intro { display: none; }
    }
  </style>
</head>

  <script>
    /* ===== آمار بازدید (بی‌صدا، بدون کوکی و بدون اطلاعات شخصی) =====
       کد سایت خودتان را از goatcounter.com بگیرید و اینجا بنویسید.
       تا وقتی خالی باشد هیچ چیزی بارگذاری نمی‌شود. */
    (function () {
      const GOATCOUNTER_CODE = 'veyma';
      if (!GOATCOUNTER_CODE) return;

      window.goatcounter = { no_onload: false };
      const sc = document.createElement('script');
      sc.async = true;
      sc.src = 'https://gc.zgo.at/count.js';
      sc.setAttribute('data-goatcounter', 'https://' + GOATCOUNTER_CODE + '.goatcounter.com/count');
      document.head.appendChild(sc);

      // شمارش کلیک روی هر دکمه
      const names = {
        'social ig': 'click-instagram', 'social tg': 'click-telegram',
        'social rb': 'click-rubika', 'social bl': 'click-bale'
      };
      document.addEventListener('click', function (e) {
        const a = e.target.closest('a, button');
        if (!a || !window.goatcounter || !window.goatcounter.count) return;
        let name = null;
        for (const k in names) { if (a.className.indexOf(k) !== -1) name = names[k]; }
        if (!name && (a.classList.contains('call') || a.classList.contains('wa'))) {
          const who = a.closest('.person');
          const n = who ? who.querySelector('.person-name').textContent.trim() : '';
          name = (a.classList.contains('call') ? 'click-call-' : 'click-whatsapp-') + n;
        }
        if (a.id === 'shareBtn') name = 'click-share';
        if (name) window.goatcounter.count({ path: name, title: name, event: true });
      });
    })();

    /* ===== جشن: ریزش گل، کاغذ رنگی، طلایی و نقره‌ای از بالا ===== */
    (function () {
      const intro = document.getElementById('intro');
      const cv = document.getElementById('introCanvas');
      if (!intro || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let finished = false;
      function finish() {
        if (finished) return;
        finished = true;
        intro.classList.add('hide');
        setTimeout(function () { intro.remove(); }, 700);
      }

      const ctx = cv.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let W, H;
      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();

      const rand = (a, b) => a + Math.random() * (b - a);
      const pick = (arr) => arr[(Math.random() * arr.length) | 0];

      const flowerCols = [['#ff7aa8', '#ffd1e1'], ['#ffffff', '#ffe3ef'], ['#ff9a6b', '#ffd9c2'], ['#b78cff', '#e6d8ff'], ['#ff5c8a', '#ffc2d4'], ['#ffd54a', '#fff3b0']];
      const paperCols = ['#ff4d6d', '#ff9f1c', '#2ec4b6', '#3a86ff', '#8338ec', '#ff70a6', '#70d6ff', '#ffd60a'];
      const goldCols = ['#d4af37', '#f5d76e', '#b8912a', '#ffe58a'];
      const silverCols = ['#c9ced6', '#eef1f5', '#9aa3ad', '#ffffff'];

      const parts = [];

      function spawn(x, y, vx, vy) {
        const r = Math.random();
        const type = r < 0.2 ? 'flower'
                   : r < 0.52 ? 'paper'
                   : r < 0.67 ? 'gold'
                   : r < 0.80 ? 'silver'
                   : r < 0.87 ? 'dot'
                   : r < 0.93 ? 'star' : 'streamer';
        const p = {
          type: type, x: x, y: y, vx: vx, vy: vy,
          rot: Math.random() * 6.28, vr: rand(-0.2, 0.2),
          flip: Math.random() * 6.28, vf: rand(0.1, 0.32),
          life: 0, wob: Math.random() * 6.28, wobAmp: rand(0.3, 0.9),
          drag: rand(0.975, 0.99), grav: rand(0.045, 0.085)
        };
        if (type === 'flower') {
          const c = pick(flowerCols);
          p.size = rand(4.5, 9); p.c1 = c[0]; p.c2 = c[1]; p.petals = Math.random() < 0.5 ? 5 : 6;
        } else if (type === 'paper') {
          p.w = rand(5, 10); p.h = rand(3, 6); p.col = pick(paperCols);
        } else if (type === 'gold') {
          p.w = rand(4, 9); p.h = rand(2.5, 5); p.col = pick(goldCols);
        } else if (type === 'silver') {
          p.w = rand(4, 9); p.h = rand(2.5, 5); p.col = pick(silverCols);
        } else if (type === 'dot') {
          p.size = rand(1.8, 3.2); p.col = pick(goldCols.concat(silverCols));
        } else if (type === 'star') {
          p.size = rand(4, 8); p.col = pick(goldCols.concat(['#ffffff']));
        } else {
          p.len = rand(14, 26); p.col = pick(paperCols.concat(goldCols, silverCols));
        }
        parts.push(p);
      }

      function drawFlower(p, alpha) {
        const r = p.size;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = alpha;
        for (let k = 0; k < p.petals; k++) {
          ctx.rotate((Math.PI * 2) / p.petals);
          ctx.beginPath();
          ctx.ellipse(0, -r * 0.55, r * 0.36, r * 0.58, 0, 0, Math.PI * 2);
          const g = ctx.createLinearGradient(0, -r * 1.1, 0, 0);
          g.addColorStop(0, p.c2); g.addColorStop(1, p.c1);
          ctx.fillStyle = g; ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = '#d4af37'; ctx.fill();
        ctx.restore();
      }

      function drawPiece(p, alpha) {
        const f = Math.cos(p.flip);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, f);
        ctx.globalAlpha = alpha;
        if (p.type === 'gold' || p.type === 'silver') {
          const g = ctx.createLinearGradient(-p.w / 2, 0, p.w / 2, 0);
          g.addColorStop(0, p.col); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, p.col);
          ctx.fillStyle = Math.abs(f) > 0.6 ? g : p.col;
        } else {
          ctx.fillStyle = p.col;
        }
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }

      function drawStar(p, alpha) {
        const tw = 0.5 + 0.5 * Math.sin(p.life * 0.4 + p.wob);
        const r = p.size * (0.5 + 0.5 * tw);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = alpha * (0.5 + 0.5 * tw);
        ctx.fillStyle = p.col;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const rr = i % 2 === 0 ? r : r * 0.28;
          const a = (Math.PI / 4) * i;
          ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }

      function drawStreamer(p, alpha) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = p.col;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-p.len / 2, 0);
        ctx.quadraticCurveTo(0, Math.sin(p.flip) * 7, p.len / 2, 0);
        ctx.stroke();
        ctx.restore();
      }

      // شلیک اولیه از بالا: یک دسته پهن در عرض صفحه + دو توپ از گوشه‌های بالا
      const initial = W < 500 ? 90 : 140;
      for (let i = 0; i < initial; i++) {
        spawn(rand(0, W), rand(-H * 0.25, -10), rand(-1.2, 1.2), rand(1.5, 5));
      }
      const cannon = W < 500 ? 35 : 55;
      for (let i = 0; i < cannon; i++) {
        spawn(-10, -10, rand(2, 7), rand(1, 6));
        spawn(W + 10, -10, rand(-7, -2), rand(1, 6));
      }

      const RAIN_FRAMES = 110;
      const perFrame = W < 500 ? 2 : 3;
      let frame = 0;

      function tick() {
        if (finished) return;
        ctx.clearRect(0, 0, W, H);
        frame++;

        // بارش پیوسته از بالا برای چند ثانیه
        if (frame <= RAIN_FRAMES) {
          for (let i = 0; i < perFrame; i++) {
            spawn(rand(0, W), -12, rand(-0.8, 0.8), rand(1.2, 3.5));
          }
        }

        let alive = 0;
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          if (p.dead) continue;
          p.life++;
          p.vx *= p.drag; p.vy = p.vy * p.drag + p.grav;
          p.wob += 0.07;
          p.x += p.vx + Math.sin(p.wob) * p.wobAmp;
          p.y += p.vy;
          p.rot += p.vr; p.flip += p.vf;
          if (p.y > H + 30 || p.x < -60 || p.x > W + 60) { p.dead = true; continue; }
          alive++;
          // ذرات آخر مسیر کمی محو می‌شوند
          const alpha = p.y > H - 60 ? Math.max(0, (H + 30 - p.y) / 90) : 1;
          if (p.type === 'flower') drawFlower(p, alpha);
          else if (p.type === 'dot') {
            ctx.globalAlpha = alpha; ctx.fillStyle = p.col;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
          }
          else if (p.type === 'star') drawStar(p, alpha);
          else if (p.type === 'streamer') drawStreamer(p, alpha);
          else drawPiece(p, alpha);
        }

        if (frame > RAIN_FRAMES && !alive) { finish(); return; }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      setTimeout(finish, 9000); // اطمینان از پاک شدن لایه
    })();

    (function () {
      document.querySelectorAll('.social').forEach(function (el) {
        el.addEventListener('click', function () {
          document.querySelectorAll('.social.lit').forEach(function (x) { x.classList.remove('lit'); });
          el.classList.add('lit');
          setTimeout(function () { el.classList.remove('lit'); }, 1200);
        });
      });
    })();

    (function () {
      const btn = document.getElementById('shareBtn');
      const toast = document.getElementById('toast');

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }

      btn.addEventListener('click', async () => {
        const data = {
          title: 'Veyma Collection | ویما',
          text: 'ویما | حس راحتی و زیبایی',
          url: window.location.href
        };

        if (navigator.share) {
          try {
            await navigator.share(data);
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        try {
          await navigator.clipboard.writeText(window.location.href);
          showToast('لینک کپی شد ✓');
        } catch {
          const input = document.createElement('input');
          input.value = window.location.href;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          showToast('لینک کپی شد ✓');
        }
      });
    })();
  </script>
</body>
</html>
