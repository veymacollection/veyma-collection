<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Veyma Collection | ویما</title>
  <meta name="description" content="Veyma Collection | ویما — حس راحتی و زیبایی">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#050505;color:#fff;font-family:Tahoma,Arial,sans-serif}
    body{min-height:100vh}
    .wrap{width:min(100%,520px);margin:auto;padding:28px 18px 34px}
    .logo{width:150px;height:150px;object-fit:cover;border-radius:50%;display:block;margin:8px auto 18px}
    h1{font-size:27px;margin:0;text-align:center;letter-spacing:.5px}
    .tagline{text-align:center;color:#d6d6d6;margin:8px 0 26px;font-size:15px}
    .section-title{font-size:15px;color:#bdbdbd;margin:22px 4px 10px}
    .links{display:grid;gap:10px}
    a.card{display:flex;align-items:center;justify-content:center;min-height:54px;padding:12px 16px;border:1px solid #292929;border-radius:14px;background:#101010;color:#fff;text-decoration:none;font-size:15px;transition:.15s}
    a.card:active{transform:scale(.98);background:#181818}
    .contact{display:flex;gap:9px}
    .contact a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;border:1px solid #292929;border-radius:14px;background:#101010;color:#fff;text-decoration:none;font-size:14px}
    .person{background:#0c0c0c;border:1px solid #202020;border-radius:16px;padding:14px;margin-bottom:10px}
    .name{text-align:center;font-weight:bold;margin-bottom:11px;font-size:15px}
    .email{direction:ltr;text-align:center;color:#ddd;font-size:13px;margin:12px 0 20px;word-break:break-word}
    .footer{text-align:center;color:#777;font-size:12px;margin-top:28px}
    .icon{font-size:19px;line-height:1}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logo.png" alt="Veyma Collection">
    <h1>VEYMA COLLECTION</h1>
    <div class="tagline">ویما | حس راحتی و زیبایی</div>

    <div class="section-title">شبکه‌های اجتماعی</div>
    <div class="links">
      <a class="card" href="https://www.instagram.com/veyma_collection" target="_blank" rel="noopener">Instagram</a>
      <a class="card" href="https://t.me/veyma_collection" target="_blank" rel="noopener">Telegram</a>
      <a class="card" href="https://ble.ir/join/C6oNNgufLi" target="_blank" rel="noopener">Bale</a>
    </div>

    <div class="section-title">تماس با ما</div>

    <div class="person">
      <div class="name">وحید عباسی</div>
      <div class="contact">
        <a href="tel:09128606076" aria-label="تماس با وحید عباسی"><span class="icon">📞</span></a>
        <a href="https://wa.me/989128606076" target="_blank" rel="noopener" aria-label="واتساپ وحید عباسی"><span class="icon">💬</span></a>
      </div>
    </div>

    <div class="person">
      <div class="name">ایمان توکلی</div>
      <div class="contact">
        <a href="tel:09125490503" aria-label="تماس با ایمان توکلی"><span class="icon">📞</span></a>
        <a href="https://wa.me/989125490503" target="_blank" rel="noopener" aria-label="واتساپ ایمان توکلی"><span class="icon">💬</span></a>
      </div>
    </div>

    <div class="section-title">ایمیل برند</div>
    <a class="card" href="mailto:veyma.collection@outlook.com">veyma.collection@outlook.com</a>

    <div class="footer">Veyma Collection © 2026</div>
  </main>
</body>
</html>
