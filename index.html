  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;color:#f5e8c7;font-family:Tahoma,Arial,sans-serif;min-height:100vh}
    .wrap{width:min(100%,480px);margin:auto;padding:32px 18px 40px}
    .logo{width:140px;height:140px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 20px;border:3px solid #6b1e2f}
    .tagline{text-align:center;color:#e8d5b5;margin-bottom:28px;font-size:16px;letter-spacing:.3px}
    .section-title{font-size:14px;color:#c9a87c;margin:26px 4px 12px;font-weight:normal}
    .links{display:grid;gap:11px}
    a.card{display:flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:12px 16px;border:1px solid #2a1a1a;border-radius:14px;background:#121212;color:#f5e8c7;text-decoration:none;font-size:15px;transition:.15s}
    a.card:active{transform:scale(.98);background:#1a1212}
    .contact{display:flex;gap:10px}
    .contact a{flex:1;display:flex;align-items:center;justify-content:center;min-height:52px;border:1px solid #2a1a1a;border-radius:14px;background:#121212;color:#f5e8c7;text-decoration:none}
    .person{background:#111;border:1px solid #2a1a1a;border-radius:16px;padding:16px;margin-bottom:12px}
    .name{text-align:center;font-weight:bold;margin-bottom:12px;font-size:15px;color:#f5e8c7}
    .address{display:flex;align-items:flex-start;gap:12px;background:#121212;border:1px solid #2a1a1a;border-radius:14px;padding:16px;font-size:14px;line-height:1.8;color:#e8d5b5}
    .footer{text-align:center;color:#7a5c4a;font-size:12px;margin-top:32px}
    .icon{width:22px;height:22px;fill:currentColor}
    .wa-icon{width:24px;height:24px;fill:#25D366}
  </style>
