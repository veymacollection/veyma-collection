<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Veyma Collection | ویما</title>
  <meta name="description" content="Veyma Collection | ویما — حس راحتی و زیبایی" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.32);
      --gold-glow: rgba(212, 175, 55, 0.22);
      --bg: #050505;
      --card: #111111;
      --border: rgba(255,255,255,0.07);
      --white: #ffffff;
      --muted: #a8a8a8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Vazirmatn', Tahoma, system-ui, sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 16px 14px 28px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
    }

    /* لوگو با هاله و حلقه طلایی */
    .logo-box {
      position: relative;
      width: 108px;
      height: 108px;
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .logo-halo {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-soft) 0%, transparent 68%);
      filter: blur(10px);
      animation: pulse 4.5s ease-in-out infinite;
    }

    .logo-ring {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 1.6px solid transparent;
      background:
        linear-gradient(var(--bg), var(--bg)) padding-box,
        conic-gradient(from 0deg,
          transparent 0%,
          var(--gold) 18%,
          transparent 38%,
          var(--gold) 58%,
          transparent 78%,
          var(--gold) 100%) border-box;
      animation: spin 12s linear infinite;
    }

    .logo {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 2;
      border: 2px solid rgba(212,175,55,0.35);
      box-shadow: 0 0 22px var(--gold-glow);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    .tagline {
      text-align: center;
      font-size: 15.5px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: 0.2px;
      margin-bottom: 2px;
    }
    .tagline span { color: var(--gold); }

    .socials {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .social {
      display: flex;
      align-items: center;
      gap: 13px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 15px;
      text-decoration: none;
      color: var(--white);
      font-size: 14.5px;
      font-weight: 600;
      transition: 0.22s ease;
    }
    .social:hover {
      border-color: rgba(212,175,55,0.35);
      transform: translateY(-1px);
      box-shadow: 0 5px 18px rgba(0,0,0,0.35);
    }
    .social .ico {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }
    .social .ico svg,
    .social .ico img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .social.ig .ico { filter: drop-shadow(0 0 10px rgba(225,48,108,0.4)); }
    .social.tg .ico { filter: drop-shadow(0 0 10px rgba(55,174,226,0.4)); }
    .social.bl .ico { filter: drop-shadow(0 0 10px rgba(0,200,170,0.35)); }

    .contacts {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .person {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .person-name {
      text-align: center;
      font-weight: 700;
      font-size: 14.5px;
      color: var(--white);
      margin-bottom: 10px;
    }

    .person-actions {
      display: flex;
      gap: 8px;
    }

    .person-actions a {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      border-radius: 11px;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
    }
    .person-actions a:hover {
      border-color: rgba(212,175,55,0.3);
      background: #1f1f1f;
    }
    .person-actions a svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .person-actions a.wa svg { fill: #25D366; }
    .person-actions a.call svg { fill: var(--gold); }

    .address {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      gap: 11px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.75;
      color: var(--muted);
    }
    .address svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-top: 3px;
      fill: var(--gold);
    }
    .address strong {
      display: block;
      color: var(--white);
      font-weight: 700;
      font-size: 13.5px;
      margin-bottom: 2px;
    }

    .share-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: linear-gradient(135deg, rgba(212,175,55,0.14), rgba(212,175,55,0.05));
      border: 1px solid rgba(212,175,55,0.38);
      border-radius: 14px;
      padding: 12px 16px;
      color: var(--gold);
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: 0.22s ease;
      margin-top: 2px;
    }
    .share-btn:hover {
      background: linear-gradient(135deg, rgba(212,175,55,0.22), rgba(212,175,55,0.08));
      border-color: rgba(212,175,55,0.55);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(212,175,55,0.12);
    }
    .share-btn svg {
      width: 17px;
      height: 17px;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1c1c1c;
      border: 1px solid rgba(212,175,55,0.4);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: 0.28s ease;
      z-index: 50;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 11.5px;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    @media (max-height: 720px) {
      .wrap { gap: 10px; }
      .logo-box { width: 92px; height: 92px; }
      .logo { width: 92px; height: 92px; }
      .tagline { font-size: 14px; }
      .social { padding: 9px 13px; }
      .person { padding: 10px 12px; }
      .person-actions a { min-height: 38px; }
    }
  </style>
</head>

  <script>
    (function () {
      const btn = document.getElementById('shareBtn');
      const toast = document.getElementById('toast');

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }

      btn.addEventListener('click', async () => {
        const data = {
          title: 'Veyma Collection | ویما',
          text: 'ویما | حس راحتی و زیبایی',
          url: window.location.href
        };

        if (navigator.share) {
          try {
            await navigator.share(data);
            return;
          } catch (err) {
            if (err.name === 'AbortError') return;
          }
        }

        try {
          await navigator.clipboard.writeText(window.location.href);
          showToast('لینک کپی شد ✓');
        } catch {
          const input = document.createElement('input');
          input.value = window.location.href;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          showToast('لینک کپی شد ✓');
        }
      });
    })();
  </script>
